<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Inspect XLSX</title>
<style>
body { font-family: monospace; padding: 12px; background: #111; color: #eee; }
pre { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h3>Memuat data/Data FAT Full.xlsx ...</h3>
<pre id="out">loading...</pre>
<script src="resources/xlsx-lite.js"></script>
<script>
(async function () {
    const out = document.getElementById('out');
    try {
        const resp = await fetch('data/Data FAT Full.xlsx?v=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const buf = await resp.arrayBuffer();
        const wb = XLSXLite.read(buf);
        let html = 'SHEETS: ' + JSON.stringify(wb.sheetNames) + '\n\n';
        for (const name of wb.sheetNames) {
            const rows = wb.sheets[name];
            html += '=== SHEET: ' + name + ' | total baris: ' + rows.length + ' ===\n';
            const head = rows[0] || [];
            html += 'HEADER (' + head.length + ' kolom):\n' + JSON.stringify(head, null, 1) + '\n\n';
            const sample = rows.slice(1, 8);
            html += 'SAMPLE 7 BARIS:\n';
            for (const r of sample) html += JSON.stringify(r) + '\n';
            html += '\n';
        }
        out.textContent = html;
    } catch (e) {
        out.textContent = 'ERROR: ' + (e && e.message ? e.message : e) + '\n' + (e && e.stack ? e.stack : '');
    }
})();
</script>
</body>
</html>
