<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Test xlsx-lite parser</title>
<style>
body { font-family: monospace; padding: 12px; background: #111; color: #eee; }
pre { white-space: pre-wrap; word-break: break-all; }
.ok { color: #6f6; }
.fail { color: #f66; }
</style>
</head>
<body>
<h3>Self-test XLSXLite (membangun XLSX sintetis di browser)</h3>
<pre id="out">running...</pre>
<script>
(function (global) {
    'use strict';

    function inflateRaw(u8) {
        return new Promise(function (resolve, reject) {
            try {
                if (typeof DecompressionStream === 'undefined') {
                    reject(new Error('DecompressionStream tidak didukung browser ini.'));
                    return;
                }
                var format = 'deflate-raw';
                var ds;
                try {
                    ds = new DecompressionStream(format);
                } catch (e) {
                    reject(new Error('DecompressionStream("deflate-raw") tidak tersedia.'));
                    return;
                }
                var blob = new Blob([u8]);
                var stream = blob.stream().pipeThrough(ds);
                new Response(stream).arrayBuffer().then(function (buf) {
                    resolve(new Uint8Array(buf));
                }).catch(reject);
            } catch (e) {
                reject(e);
            }
        });
    }

    function readZip(buf) {
        var u8 = new Uint8Array(buf);
        var dv = new DataView(buf);
        var eocd = -1;
        var minEocd = Math.max(0, u8.length - 66000);
        for (var i = u8.length - 22; i >= minEocd; i--) {
            if (u8[i] === 0x50 && u8[i + 1] === 0x4b && u8[i + 2] === 0x05 && u8[i + 3] === 0x06) {
                eocd = i;
                break;
            }
        }
        if (eocd < 0) throw new Error('ZIP: End of Central Directory tidak ditemukan (bukan file .xlsx?)');
        var entryCount = dv.getUint16(eocd + 10, true);
        var cdOffset = dv.getUint32(eocd + 16, true);
        var entries = {};
        var p = cdOffset;
        for (var n = 0; n < entryCount; n++) {
            if (dv.getUint32(p, true) !== 0x02014b50) break;
            var method = dv.getUint16(p + 10, true);
            var compSize = dv.getUint32(p + 20, true);
            var nameLen = dv.getUint16(p + 28, true);
            var extraLen = dv.getUint16(p + 30, true);
            var commentLen = dv.getUint16(p + 32, true);
            var localOffset = dv.getUint32(p + 42, true);
            var name = '';
            for (var c = 0; c < nameLen; c++) name += String.fromCharCode(u8[p + 46 + c]);
            entries[name] = { method: method, compSize: compSize, localOffset: localOffset };
            p += 46 + nameLen + extraLen + commentLen;
        }
        return { u8: u8, dv: dv, entries: entries };
    }

    function zipEntryData(zip, name) {
        var entry = zip.entries[name];
        if (!entry) return null;
        var u8 = zip.u8;
        var off = entry.localOffset;
        var dv = zip.dv;
        if (dv.getUint32(off, true) !== 0x04034b50) throw new Error('ZIP: local header rusak untuk ' + name);
        var nameLen = dv.getUint16(off + 26, true);
        var extraLen = dv.getUint16(off + 28, true);
        var dataStart = off + 30 + nameLen + extraLen;
        var raw = u8.subarray(dataStart, dataStart + entry.compSize);
        if (entry.method === 0) return raw;
        if (entry.method === 8) return inflateRaw(raw);
        throw new Error('ZIP: metode kompresi tidak didukung (' + entry.method + ')');
    }

    function u8ToText(u8) {
        try {
            return new TextDecoder('utf-8').decode(u8);
        } catch (e) {
            var s = '';
            for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
            return decodeURIComponent(escape(s));
        }
    }

    function parseXml(text) {
        var cleaned = text.replace(/<([a-zA-Z0-9_]+):/g, '<$1__NS__').replace(/<\/([a-zA-Z0-9_]+):/g, '</$1__NS__');
        var doc = new DOMParser().parseFromString(cleaned, 'text/xml');
        var err = doc.getElementsByTagName('parsererror');
        if (err && err.length) throw new Error('XML parse error: ' + (err[0].textContent || '').slice(0, 200));
        return doc;
    }

    function childElements(el, tagName) {
        var out = [];
        if (!el) return out;
        for (var i = 0; i < el.children.length; i++) {
            var c = el.children[i];
            if (c.nodeName === tagName || c.nodeName.indexOf('__NS__' + tagName, c.nodeName.length - tagName.length - 6) !== -1) out.push(c);
        }
        return out;
    }

    function firstChild(el, tagName) {
        var list = childElements(el, tagName);
        return list.length ? list[0] : null;
    }

    function columnNameToIndex(name) {
        var n = 0;
        for (var i = 0; i < name.length; i++) {
            n = n * 26 + (name.charCodeAt(i) - 64);
        }
        return n - 1;
    }

    function parseCellRef(ref) {
        var m = /^([A-Z]+)(\d+)$/.exec(String(ref || '').toUpperCase());
        if (!m) return null;
        return { col: columnNameToIndex(m[1]), row: parseInt(m[2], 10) - 1 };
    }

    function excelSerialToDateString(serial) {
        var whole = Math.floor(serial);
        var frac = serial - whole;
        var days = whole - 25569;
        var ms = days * 86400000 + Math.round(frac * 86400000);
        var d = new Date(ms);
        if (isNaN(d.getTime())) return null;
        var dd = String(d.getUTCDate()).padStart(2, '0');
        var mm = String(d.getUTCMonth() + 1).padStart(2, '0');
        var yyyy = d.getUTCFullYear();
        return dd + '/' + mm + '/' + yyyy;
    }

    function decodeCell(cEl, sharedStrings, stylesDateSet) {
        var ref = cEl.getAttribute('r');
        var t = cEl.getAttribute('t') || '';
        var s = cEl.getAttribute('s');
        var vEl = firstChild(cEl, 'v');
        var isEl = firstChild(cEl, 'is');
        var text = '';
        if (t === 's' && vEl) {
            var idx = parseInt(vEl.textContent, 10);
            text = sharedStrings[idx] !== undefined ? sharedStrings[idx] : '';
        } else if (t === 'inlineStr' && isEl) {
            var tNodes = isEl.getElementsByTagName('*');
            for (var i = 0; i < tNodes.length; i++) {
                var nn = tNodes[i].nodeName;
                if (nn === 't' || nn.indexOf('__NS__t', nn.length - 7) !== -1) {
                    text += tNodes[i].textContent;
                }
            }
        } else if (vEl) {
            text = vEl.textContent;
            if (s !== null && stylesDateSet && stylesDateSet.has(parseInt(s, 10)) && text !== '' && isFinite(Number(text))) {
                var ds = excelSerialToDateString(Number(text));
                if (ds) text = ds;
            }
        }
        return { ref: ref, value: text };
    }

    function buildDateStyleSet(stylesXml) {
        var set = new Set();
        if (!stylesXml) return set;
        try {
            var doc = parseXml(stylesXml);
            var numFmts = {};
            childElements(firstChild(doc.documentElement, 'numFmts'), 'numFmt').forEach(function (nf) {
                numFmts[parseInt(nf.getAttribute('numFmtId'), 10)] = String(nf.getAttribute('formatCode') || '');
            });
            var cellXfs = firstChild(doc.documentElement, 'cellXfs');
            childElements(cellXfs, 'xf').forEach(function (xf, i) {
                var id = parseInt(xf.getAttribute('numFmtId'), 10);
                if (!isFinite(id)) return;
                if ((id >= 14 && id <= 22) || (id >= 45 && id <= 47) || (id === 14)) {
                    set.add(i);
                } else if (numFmts[id]) {
                    var code = numFmts[id].toLowerCase();
                    if (code.indexOf('y') !== -1 || code.indexOf('d') !== -1) set.add(i);
                }
            });
        } catch (e) { }
        return set;
    }

    async function read(arrayBuffer) {
        var zip = readZip(arrayBuffer);
        var sharedStrings = [];
        var ssData = await zipEntryData(zip, 'xl/sharedStrings.xml');
        if (ssData) {
            var ssDoc = parseXml(u8ToText(ssData));
            childElements(ssDoc.documentElement, 'si').forEach(function (si) {
                var text = '';
                var rNodes = childElements(si, 'r');
                if (rNodes.length) {
                    rNodes.forEach(function (r) {
                        var tEl = firstChild(r, 't');
                        if (tEl) text += tEl.textContent;
                    });
                } else {
                    var tEl = firstChild(si, 't');
                    if (tEl) text = tEl.textContent;
                }
                sharedStrings.push(text);
            });
        }
        var stylesData = await zipEntryData(zip, 'xl/styles.xml');
        var dateStyles = buildDateStyleSet(stylesData ? u8ToText(stylesData) : null);
        var wbData = await zipEntryData(zip, 'xl/workbook.xml');
        if (!wbData) throw new Error('XLSX: xl/workbook.xml tidak ditemukan.');
        var wbDoc = parseXml(u8ToText(wbData));
        var sheetNodes = childElements(firstChild(wbDoc.documentElement, 'sheets'), 'sheet');
        var relsData = await zipEntryData(zip, 'xl/_rels/workbook.xml.rels');
        var relMap = {};
        if (relsData) {
            var relsDoc = parseXml(u8ToText(relsData));
            childElements(relsDoc.documentElement, 'Relationship').forEach(function (rel) {
                relMap[rel.getAttribute('Id')] = rel.getAttribute('Target');
            });
        }
        var sheetNames = [];
        var sheets = {};
        for (const sh of sheetNodes) {
            var name = sh.getAttribute('name') || ('Sheet' + (sheetNames.length + 1));
            var rid = sh.getAttribute('r:id') || sh.getAttribute('id');
            var target = relMap[rid] || '';
            var path = target.replace(/^\//, '');
            if (path.indexOf('xl/') !== 0) path = 'xl/' + path;
            var data = await zipEntryData(zip, path);
            if (!data) return;
            var doc = parseXml(u8ToText(data));
            var sheetDataEl = firstChild(doc.documentElement, 'sheetData');
            var rowsOut = [];
            childElements(sheetDataEl, 'row').forEach(function (rowEl) {
                var cells = [];
                childElements(rowEl, 'c').forEach(function (cEl) {
                    var cell = decodeCell(cEl, sharedStrings, dateStyles);
                    if (!cell.ref) return;
                    var pos = parseCellRef(cell.ref);
                    if (!pos) return;
                    cells[pos.col] = cell.value;
                });
                rowsOut.push(cells);
            });
            sheetNames.push(name);
            sheets[name] = rowsOut;
        }
        return { sheetNames: sheetNames, sheets: sheets };
    }

    function sheetToObjects(rows) {
        if (!Array.isArray(rows) || rows.length === 0) return [];
        var header = rows[0] || [];
        var out = [];
        for (var i = 1; i < rows.length; i++) {
            var row = rows[i];
            if (!row || row.length === 0) continue;
            var isEmpty = true;
            var obj = {};
            for (var c = 0; c < header.length; c++) {
                var key = String(header[c] === undefined || header[c] === null ? '' : header[c]).trim();
                var val = row[c] === undefined || row[c] === null ? '' : String(row[c]).trim();
                if (key === '') key = 'Kolom' + (c + 1);
                obj[key] = val;
                if (val !== '') isEmpty = false;
            }
            if (!isEmpty) out.push(obj);
        }
        return out;
    }

    global.XLSXLite = {
        read: read,
        sheetToObjects: sheetToObjects,
        excelSerialToDateString: excelSerialToDateString
    };

})(typeof window !== 'undefined' ? window : this);
</script>
<script>
(async function () {
    const out = document.getElementById('out');
    const log = [];
    const ok = (name, cond, extra) => log.push((cond ? 'PASS ' : 'FAIL ') + name + (extra !== undefined ? ' | ' + extra : ''));
    try {
        if (typeof XLSXLite === 'undefined') {
            // Diagnosa: coba parse ulang isi script pertama di dalam halaman
            const code = document.scripts[0].textContent;
            let parseMsg = 'tidak diketahui';
            try { new Function(code); parseMsg = 'Function() OK (??)'; }
            catch (e) { parseMsg = 'Function() ERR: ' + e.message; }
            throw new Error('XLSXLite tidak ter-load. Diagnosa in-page: ' + parseMsg + ' | len=' + code.length);
        }
        // ===== Buat XLSX sintetis: 1 sheet, sharedStrings + tanggal, beberapa baris =====
        const encoder = new TextEncoder();

        const crcTable = (() => {
            const t = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                t[n] = c >>> 0;
            }
            return t;
        })();
        const crc32 = (u8) => {
            let c = 0xFFFFFFFF;
            for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
            return (c ^ 0xFFFFFFFF) >>> 0;
        };

        async function deflateRaw(u8) {
            if (typeof CompressionStream === 'undefined') return null;
            try {
                const cs = new CompressionStream('deflate-raw');
                const stream = new Blob([u8]).stream().pipeThrough(cs);
                const buf = await new Response(stream).arrayBuffer();
                return new Uint8Array(buf);
            } catch (e) { return null; }
        }

        function makeEntry(name, dataU8, method, crc) {
            const nameU8 = encoder.encode(name);
            const local = new Uint8Array(30 + nameU8.length + dataU8.length);
            const dv = new DataView(local.buffer);
            dv.setUint32(0, 0x04034b50, true);
            dv.setUint16(4, 20, true);
            dv.setUint16(8, method, true);
            dv.setUint16(12, 0x2100, true);
            dv.setUint32(14, crc, true);
            dv.setUint32(18, dataU8.length, true);
            dv.setUint32(22, dataU8.length, true);
            dv.setUint16(26, nameU8.length, true);
            local.set(nameU8, 30);
            local.set(dataU8, 30 + nameU8.length);

            const central = new Uint8Array(46 + nameU8.length);
            const cv = new DataView(central.buffer);
            cv.setUint32(0, 0x02014b50, true);
            cv.setUint16(4, 20, true);
            cv.setUint16(6, 20, true);
            cv.setUint16(10, method, true);
            cv.setUint16(14, 0x2100, true);
            cv.setUint32(16, crc, true);
            cv.setUint32(20, dataU8.length, true);
            cv.setUint32(24, dataU8.length, true);
            cv.setUint16(28, nameU8.length, true);
            central.set(nameU8, 46);
            return { local, central };
        }

        async function buildZip(files) {
            const parts = [];
            const centrals = [];
            let offset = 0;
            for (const f of files) {
                const raw = encoder.encode(f.text);
                const crc = crc32(raw);
                const deflated = await deflateRaw(raw);
                const useDeflate = deflated && deflated.length < raw.length;
                const data = useDeflate ? deflated : raw;
                const method = useDeflate ? 8 : 0;
                const e = makeEntry(f.name, data, method, crc);
                new DataView(e.central.buffer).setUint32(42, offset, true);
                parts.push(e.local);
                centrals.push(e.central);
                offset += e.local.length;
            }
            const cdStart = offset;
            let cdSize = 0;
            centrals.forEach(c => cdSize += c.length);
            const eocd = new Uint8Array(22);
            const ev = new DataView(eocd.buffer);
            ev.setUint32(0, 0x06054b50, true);
            ev.setUint16(8, files.length, true);
            ev.setUint16(10, files.length, true);
            ev.setUint32(12, cdSize, true);
            ev.setUint32(16, cdStart, true);
            const total = offset + cdSize + 22;
            const outBuf = new Uint8Array(total);
            let pos = 0;
            for (const p of parts) { outBuf.set(p, pos); pos += p.length; }
            for (const c of centrals) { outBuf.set(c, pos); pos += c.length; }
            outBuf.set(eocd, pos);
            return outBuf;
        }

        // ===== Konten sheet uji =====
        const headers = ['ID Customer', 'Label', 'Kota/Kabupaten', 'Nama Site', 'Latitude', 'Longitude', 'Tgl Visit'];
        const rows = [
            ['ID001', 'PT Maju Jaya', 'Kab. Sidoarjo', 'SITE-SDA-01', -7.4485, 112.7152, 45000],
            ['ID002', 'Toko Berkah', 'Kota Surabaya', 'SITE-SBY-02', -7.2575, 112.7521, 45001],
            ['ID003', 'Warnet Zaman', 'Kab. Sidoarjo', 'SITE-SDA-03', -7.38, 112.68, 45002]
        ];

        const shared = [];
        const pushShared = (s) => { shared.push(s); return shared.length - 1; };
        const colName = (i) => {
            let s = '';
            i++;
            while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
            return s;
        };

        let sheetRows = '<row r="1">';
        headers.forEach((h, i) => { sheetRows += `<c r="${colName(i)}1" t="s"><v>${pushShared(h)}</v></c>`; });
        sheetRows += '</row>';
        rows.forEach((r, ri) => {
            sheetRows += `<row r="${ri + 2}">`;
            r.forEach((val, ci) => {
                const ref = colName(ci) + (ri + 2);
                if (ci === 6) {
                    sheetRows += `<c r="${ref}" s="1"><v>${val}</v></c>`;
                } else if (typeof val === 'number') {
                    sheetRows += `<c r="${ref}"><v>${val}</v></c>`;
                } else {
                    sheetRows += `<c r="${ref}" t="s"><v>${pushShared(val)}</v></c>`;
                }
            });
            sheetRows += '</row>';
        });

        const files = [
            { name: '[Content_Types].xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/></Types>` },
            { name: '_rels/.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
            { name: 'xl/workbook.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="FAT" sheetId="1" r:id="rId1"/></sheets></workbook>` },
            { name: 'xl/_rels/workbook.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>` },
            { name: 'xl/styles.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="1"><font/></fonts><fills count="1"><fill/></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf numFmtId="164" applyNumberFormat="1"/></cellXfs></styleSheet>` },
            { name: 'xl/sharedStrings.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="10" uniqueCount="10"><si><t>${shared.join('</t></si><si><t>')}</t></si></sst>` },
            { name: 'xl/worksheets/sheet1.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetRows}</sheetData></worksheet>` }
        ];

        const zipU8 = await buildZip(files);
        ok('zip magic', zipU8[0] === 0x50 && zipU8[1] === 0x4b, 'size=' + zipU8.length);

        const wb = await XLSXLite.read(zipU8.buffer);
        ok('sheetNames', JSON.stringify(wb.sheetNames) === JSON.stringify(['FAT']), JSON.stringify(wb.sheetNames));
        const sheet = wb.sheets['FAT'];
        ok('rows count', sheet.length === 4, 'rows=' + sheet.length);
        const objs = XLSXLite.sheetToObjects(sheet);
        ok('objs count', objs.length === 3, 'objs=' + objs.length);
        ok('header shared string', objs[0]['ID Customer'] === 'ID001', JSON.stringify(objs[0]));
        ok('nama site', objs[1]['Nama Site'] === 'SITE-SBY-02', objs[1] ? objs[1]['Nama Site'] : 'undefined');
        ok('date convert', objs[0]['Tgl Visit'] === '25/02/2023', 'got=' + objs[0]['Tgl Visit']);
        ok('number lat', objs[0]['Latitude'] === '-7.4485', 'got=' + objs[0]['Latitude']);

        out.innerHTML = log.map(l => l.startsWith('PASS') ? `<span class="ok">${l}</span>` : `<span class="fail">${l}</span>`).join('\n');
    } catch (e) {
        out.innerHTML = '<span class="fail">ERROR: ' + (e && e.message ? e.message : e) + '</span>\n' + (e && e.stack ? e.stack : '');
    }
})();
</script>
</body>
</html>
